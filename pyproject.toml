[project]
name = "camera-map"
version = "0.1.0"
description = ""
authors = [
    { name = "Daniel" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",

    "sqlalchemy>=2.0.51,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.5,<2.0.0",
    "greenlet>=3.5.4,<4.0.0",
    "psycopg2>=2.9.12,<3.0.0",

    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",

    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "cryptography>=43.0.0,<44.0.0",

    "celery>=5.3.4,<6.0.0",
    "celery-pool-asyncio>=0.2.0,<1.0.0",
    "celery-aio-pool>=0.1.0rc8,<1.0.0",

    "redis>=5.0.1,<6.0.0",

    "httpx>=0.28.1,<1.0.0",
    "aiohttp>=3.10.0,<4.0.0",

    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.20,<1.0.0",

    "openpyxl>=3.1.2,<4.0.0",
    "pandas>=2.1.0,<3.0.0",
    "reportlab>=4.0.0,<5.0.0",

    "minio>=7.2.0,<8.0.0",
    "flower>=2.0.1,<3.0.0",

    "ruff>=0.16.2,<1.0.0",

]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-cov = ">=5.0.0,<6.0.0"
pytest-dotenv = ">=0.5.2,<1.0.0"
black = ">=26.0.0,<27.0.0"
isort = ">=5.13.0,<6.0.0"
flake8 = ">=7.0.0,<8.0.0"
mypy = ">=2.0.0,<3.0.0"
pre-commit = ">=3.5.0,<4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

